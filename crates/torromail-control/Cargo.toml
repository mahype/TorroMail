[package]
name = "torromail-control"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.2"
roxmltree = "0.21"
serde_json = "1"
sha2 = "0.10"

# The macOS keychain, with the team-scoped access list the app uses.
[target.'cfg(target_os = "macos")'.dependencies]
torromail-keychain = { path = "../torromail-keychain" }

# The Windows Credential Manager. Only there: every other desktop has the
# Secret Service, reached without a library of ours.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
