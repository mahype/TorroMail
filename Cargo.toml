[workspace]
members = [
    "crates/torromail-core",
    "crates/torromail-imap-tls",
    "crates/torromail-mcp",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TorroMail contributors"]
repository = "https://example.invalid/torromail"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

