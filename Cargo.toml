[workspace]
members = [
    "crates/torromail-cache",
    "crates/torromail-control",
    "crates/torromail-core",
    "crates/torromail-discovery",
    "crates/torromail-imap-tls",
    "crates/torromail-mcp",
    "crates/torromail-oauth",
    "crates/torromail-tui",
]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TorroMail contributors"]
repository = "https://github.com/mahype/TorroMail"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
