name: Release

# One tag, one release, every platform: the signed and notarized Mac app with
# its Sparkle appcast, the Mac terminal programs (signed and notarized too),
# the Linux programs with their AUR package, and the Windows programs
# (unsigned, and marked experimental until someone has used them on a real
# machine).
#
# The release is assembled as a draft and only published once every job has
# delivered. The Mac app's updater reads releases/latest/download/appcast.xml,
# and a draft is nobody's "latest" — so no Mac sees a release that is still
# missing a file, and a failed Linux build ships nothing at all.
#
# A tag like v0.10.0-rc.1 is a release candidate: built and signed exactly the
# same, published as a pre-release. GitHub never calls a pre-release "latest",
# so no installed app is offered it; it is there to be downloaded and tried.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      pkgver: ${{ steps.read.outputs.pkgver }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.([0-9]+))?$ ]]; then
            echo "::error::the tag must look like v0.10.0 or v0.10.0-rc.1, not $TAG"
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          candidate="${BASH_REMATCH[3]}"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ "$base" != "$cargo_version" ]]; then
            echo "::error::the tag says $base, Cargo.toml says $cargo_version"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A package version may not contain a hyphen.
          echo "pkgver=${base}${candidate:+rc$candidate}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "$candidate" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      pkgver: ${{ needs.version.outputs.pkgver }}
      pkgrel: '1'
      name: torromail-${{ needs.version.outputs.version }}
      tag: ${{ github.ref_name }}

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    env:
      NAME: torromail-${{ needs.version.outputs.version }}-x86_64-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p torromail-mcp -p torromail-tui
      - name: Smoke test
        shell: bash
        run: |
          target/release/torromail.exe --version
          target/release/torromail-mcp.exe --list-tools > /dev/null
      - name: Pack
        shell: bash
        run: |
          mkdir -p "dist/$NAME"
          cp target/release/torromail.exe target/release/torromail-mcp.exe README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  macos:
    name: macOS — build, sign, notarize
    needs: version
    runs-on: macos-14
    timeout-minutes: 90
    # generate-notes, below, is a write call.
    permissions:
      contents: write
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6, universal builds)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain"
          kpw="$(openssl rand -base64 24)"
          cert_path="$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$kpw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpw" "$keychain"

          printf '%s' "$CERT_B64" | base64 --decode > "$cert_path"
          security import "$cert_path" -k "$keychain" \
              -P "$CERT_PW" \
              -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert_path"

          # Prepend our keychain to the user search list so codesign can find the
          # identity — without clobbering the runner's default keychains.
          existing="$(security list-keychains -d user | xargs)"
          security list-keychains -d user -s "$keychain" $existing

          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$kpw" "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" \
              | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "error: no Developer ID Application identity found in imported keychain" >&2
            security find-identity -v -p codesigning "$keychain" >&2 || true
            exit 1
          fi
          echo "Using signing identity: $identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build universal .app
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: REQUIRE_SPARKLE_KEY=1 ./scripts/build-macos-app.sh

      - name: Sign and notarize .app
        run: ./scripts/codesign-macos.sh

      # Same certificate, same team as the app: that is what lets the terminal
      # programs and the app share keychain items without a dialog.
      - name: Build, sign and notarize the terminal programs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/build-cli-macos.sh

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Smoke test DMG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ./scripts/smoke-test-dmg.sh "dist/TorroMail-${version}.dmg"

      - name: Verify Sparkle signing tool
        run: |
          set -euo pipefail
          sign_update="$(find apps/TorroMailApp/.build \
            -path '*/old_dsa_scripts' -prune -o \
            -type f -name sign_update -print 2>/dev/null | head -1 || true)"
          if [[ ! -x "$sign_update" ]]; then
            echo "error: Sparkle sign_update was not materialised by the Swift build" >&2
            exit 1
          fi
          echo "sign_update: $sign_update"

      - name: Generate release notes for updater
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > release-notes.md
          echo "Generated $(wc -c < release-notes.md) bytes of release notes"

      - name: Create signed Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ./scripts/create-appcast.sh \
            "dist/TorroMail-${version}.dmg" \
            "$version" \
            "https://github.com/mahype/TorroMail/releases/tag/${TAG}" \
            "dist/appcast.xml" \
            "release-notes.md"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/TorroMail-*.dmg
            dist/SHA256SUMS.txt
            dist/appcast.xml
            dist/torromail-*-universal-macos.tar.gz
            dist/torromail-*-universal-macos.tar.gz.sha256
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true

  publish:
    name: Publish
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Assemble the release as a draft, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          ls -l assets
          # The appcast an installed Mac app comes looking for, and a download
          # for every system.
          test -f assets/appcast.xml
          ls assets/TorroMail-*.dmg \
             assets/torromail-*-universal-macos.tar.gz \
             assets/torromail-*-x86_64-linux.tar.gz \
             assets/torromail-*-aarch64-linux.tar.gz \
             assets/torromail-*-x86_64-windows.zip > /dev/null

          flags=(--draft --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" assets/* "${flags[@]}"

          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
