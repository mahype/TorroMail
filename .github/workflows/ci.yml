name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build -p torromail-mcp

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: a platform nobody develops on should report every
      # broken test at once, not only the first crate's.
      - run: cargo test --workspace --no-fail-fast
      # What a release packs, built and started once, so the first tag is not
      # the first time anyone tries.
      - run: cargo build --release --locked -p torromail-mcp -p torromail-tui
      - shell: bash
        run: |
          target/release/torromail.exe --version
          target/release/torromail-mcp.exe --list-tools > /dev/null

  macos:
    name: Rust + Swift (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The Swift contract suite and the app supervisor look for the server in
      # target/debug, so it is built before anything Swift runs.
      - run: cargo build -p torromail-mcp
      - name: Build Swift contract suite
        run: swift build --package-path apps/TorroMailApp --scratch-path apps/TorroMailApp/.build --product TorroMailKitContract
      - name: Swift contract suite
        run: apps/TorroMailApp/.build/debug/TorroMailKitContract
      - name: Why the suite died (only on failure)
        if: failure()
        run: |
          codesign -dvvv --entitlements - apps/TorroMailApp/.build/debug/TorroMailKitContract || true
          log show --last 3m --style compact --predicate 'eventMessage CONTAINS "TorroMailKitContract"' | tail -40 || true
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5 || true
      - name: Swift app build
        run: swift build --package-path apps/TorroMailApp --scratch-path apps/TorroMailApp/.build
