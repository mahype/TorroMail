name: Build (Linux)

# The Linux half of a release, for whoever publishes it: release.yml for a
# joint `v*` release, release-linux.yml for a Linux-only one. Leaves three
# artifacts behind — tarball-x86_64, tarball-aarch64 and aur — and publishes
# nothing itself.

on:
  workflow_call:
    inputs:
      pkgver:
        description: Package version, without hyphens (0.10.0, 0.10.0rc1)
        required: true
        type: string
      pkgrel:
        description: Package build number
        required: true
        type: string
      name:
        description: What the archives are called, up to the architecture (torromail-0.10.0)
        required: true
        type: string
      tag:
        description: The release tag the archives will be downloadable under
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # The oldest runner images on offer, for the oldest glibc: a program
          # built here starts on anything newer.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      NAME: ${{ inputs.name }}-${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p torromail-mcp -p torromail-tui
      - name: Smoke test
        run: |
          target/release/torromail --version
          target/release/torromail-mcp --list-tools > /dev/null
      - name: Pack
        run: |
          mkdir -p "dist/$NAME"
          cp target/release/torromail target/release/torromail-mcp README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          tar -C dist --owner=0 --group=0 -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  aur:
    name: AUR package (built and installed on Arch)
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      PKGVER: ${{ inputs.pkgver }}
      PKGREL: ${{ inputs.pkgrel }}
      NAME: ${{ inputs.name }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: tarballs
          merge-multiple: true
      - name: Fill in the PKGBUILD
        run: |
          mkdir work
          cp packaging/aur/torromail-bin/PKGBUILD work/
          # makepkg takes a source it finds beside the PKGBUILD instead of
          # downloading it — the release does not exist yet.
          cp tarballs/*.tar.gz work/
          sum() { cut -d' ' -f1 "tarballs/$NAME-$1-linux.tar.gz.sha256"; }
          sed -i \
            -e "s/^pkgver=.*/pkgver=$PKGVER/" \
            -e "s/^pkgrel=.*/pkgrel=$PKGREL/" \
            -e "s/^_tag=.*/_tag=$TAG/" \
            -e "s/^_name=.*/_name=$NAME/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$(sum x86_64)')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$(sum aarch64)')/" \
            work/PKGBUILD
          # The template's notes about these workflows are no use on the AUR.
          sed -i -e '/^# The release workflows/,/^# AUR; the copy here is the template\.$/d' \
                 -e '/^# Which release the archives come from/,/^# linux-v.*\.$/d' work/PKGBUILD
          cat work/PKGBUILD
          ! grep -q FILLED_IN work/PKGBUILD
      - name: Build, install and run the package
        run: |
          # makepkg refuses to run as root.
          useradd --create-home builder
          chown -R builder work
          cd work
          sudo -u builder makepkg --force --nodeps
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          pacman -Sy --noconfirm libsecret
          pacman -U --noconfirm ./*.pkg.tar.zst
          torromail --version
          torromail-mcp --list-tools > /dev/null
          test -f /usr/share/licenses/torromail-bin/LICENSE-MIT
          tar -czf ../torromail-bin-aur.tar.gz PKGBUILD .SRCINFO
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: torromail-bin-aur.tar.gz
          if-no-files-found: error
