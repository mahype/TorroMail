name: Release (Linux)

# A Linux-only release, under its own tag (`linux-v0.9.0-2`: the workspace
# version, then a build number) — for a fix that does not concern the Mac app.
# A joint release of everything is release.yml's, on a `v*` tag. The Mac app
# reads its appcast from the release GitHub calls "latest", so a release made
# here is never marked latest.
#
# Started by hand, or by a pull request that touches the packaging, it is a
# dry run: everything is built and the package is installed in a clean Arch
# container, but nothing is published.

on:
  push:
    tags: ['linux-v*']
  pull_request:
    paths:
      - .github/workflows/release-linux.yml
      - .github/workflows/build-linux.yml
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      pkgver: ${{ steps.read.outputs.pkgver }}
      pkgrel: ${{ steps.read.outputs.pkgrel }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^linux-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
              echo "::error::the tag must look like linux-v0.9.0-1, not $REF_NAME"
              exit 1
            fi
            pkgver="${BASH_REMATCH[1]}"
            pkgrel="${BASH_REMATCH[2]}"
            if [[ "$pkgver" != "$cargo_version" ]]; then
              echo "::error::the tag says $pkgver, Cargo.toml says $cargo_version"
              exit 1
            fi
          else
            pkgver="$cargo_version"
            pkgrel=0
          fi
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      pkgver: ${{ needs.version.outputs.pkgver }}
      pkgrel: ${{ needs.version.outputs.pkgrel }}
      name: torromail-${{ needs.version.outputs.pkgver }}-${{ needs.version.outputs.pkgrel }}
      tag: linux-v${{ needs.version.outputs.pkgver }}-${{ needs.version.outputs.pkgrel }}

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [version, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # --latest=false is the point: the Mac app's updater reads
          # releases/latest/download/appcast.xml, and this release has none.
          gh release create "$TAG" assets/* \
            --title "TorroMail for Linux $TAG" \
            --latest=false \
            --notes "The Linux programs — \`torromail\` (terminal control surface) and \`torromail-mcp\` (the server assistants start) — for x86_64 and aarch64, built against glibc 2.35.

          Arch and Omarchy: \`torromail-bin\` from the AUR, or unpack \`torromail-bin-aur.tar.gz\` and run \`makepkg -si\`.

          Anywhere else: unpack the tarball for your machine and put both programs side by side on your PATH. \`secret-tool\` (libsecret) and a running keyring are needed to store passwords.

          This release carries no Mac app; those are the \`v*\` releases."
