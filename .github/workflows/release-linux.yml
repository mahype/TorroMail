name: Release (Linux)

# The Linux programs, as tarballs and as an AUR package, under their own tag
# (`linux-v0.9.0-1`: the workspace version, then a build number). Kept apart
# from release.yml on purpose: a `v*` tag signs, notarizes and ships the Mac
# app to every installed copy through Sparkle, and the Mac app reads its
# appcast from the release GitHub calls "latest" — so a release made here is
# never marked latest.
#
# Started by hand, or by a pull request that touches the packaging, it is a
# dry run: everything is built and the package is installed in a clean Arch
# container, but nothing is published.

on:
  push:
    tags: ['linux-v*']
  pull_request:
    paths:
      - .github/workflows/release-linux.yml
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      pkgver: ${{ steps.read.outputs.pkgver }}
      pkgrel: ${{ steps.read.outputs.pkgrel }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^linux-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
              echo "::error::the tag must look like linux-v0.9.0-1, not $REF_NAME"
              exit 1
            fi
            pkgver="${BASH_REMATCH[1]}"
            pkgrel="${BASH_REMATCH[2]}"
            if [[ "$pkgver" != "$cargo_version" ]]; then
              echo "::error::the tag says $pkgver, Cargo.toml says $cargo_version"
              exit 1
            fi
          else
            pkgver="$cargo_version"
            pkgrel=0
          fi
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          # The oldest runner images on offer, for the oldest glibc: a program
          # built here starts on anything newer.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      NAME: torromail-${{ needs.version.outputs.pkgver }}-${{ needs.version.outputs.pkgrel }}-${{ matrix.arch }}-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p torromail-mcp -p torromail-tui
      - name: Smoke test
        run: |
          target/release/torromail --version
          target/release/torromail-mcp --list-tools > /dev/null
      - name: Pack
        run: |
          mkdir -p "dist/$NAME"
          cp target/release/torromail target/release/torromail-mcp README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          tar -C dist --owner=0 --group=0 -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  aur:
    name: AUR package (built and installed on Arch)
    needs: [version, build]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      PKGVER: ${{ needs.version.outputs.pkgver }}
      PKGREL: ${{ needs.version.outputs.pkgrel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: tarballs
          merge-multiple: true
      - name: Fill in the PKGBUILD
        run: |
          mkdir work
          cp packaging/aur/torromail-bin/PKGBUILD work/
          # makepkg takes a source it finds beside the PKGBUILD instead of
          # downloading it — the release does not exist yet.
          cp tarballs/*.tar.gz work/
          sum() { cut -d' ' -f1 "tarballs/torromail-$PKGVER-$PKGREL-$1-linux.tar.gz.sha256"; }
          sed -i \
            -e "s/^pkgver=.*/pkgver=$PKGVER/" \
            -e "s/^pkgrel=.*/pkgrel=$PKGREL/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$(sum x86_64)')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$(sum aarch64)')/" \
            work/PKGBUILD
          # The template's note about this workflow is no use on the AUR.
          sed -i '/^# The release workflow/,/^# here is the template\.$/d' work/PKGBUILD
          cat work/PKGBUILD
      - name: Build, install and run the package
        run: |
          # makepkg refuses to run as root.
          useradd --create-home builder
          chown -R builder work
          cd work
          sudo -u builder makepkg --force --nodeps
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          pacman -Sy --noconfirm libsecret
          pacman -U --noconfirm ./*.pkg.tar.zst
          torromail --version
          torromail-mcp --list-tools > /dev/null
          test -f /usr/share/licenses/torromail-bin/LICENSE-MIT
          tar -czf ../torromail-bin-aur.tar.gz PKGBUILD .SRCINFO
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: torromail-bin-aur.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [version, build, aur]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # --latest=false is the point: the Mac app's updater reads
          # releases/latest/download/appcast.xml, and this release has none.
          gh release create "$TAG" assets/* \
            --title "TorroMail for Linux $TAG" \
            --latest=false \
            --notes "The Linux programs — \`torromail\` (terminal control surface) and \`torromail-mcp\` (the server assistants start) — for x86_64 and aarch64, built against glibc 2.35.

          Arch and Omarchy: \`torromail-bin\` from the AUR, or unpack \`torromail-bin-aur.tar.gz\` and run \`makepkg -si\`.

          Anywhere else: unpack the tarball for your machine and put both programs side by side on your PATH. \`secret-tool\` (libsecret) and a running keyring are needed to store passwords.

          This release carries no Mac app; those are the \`v*\` releases."
